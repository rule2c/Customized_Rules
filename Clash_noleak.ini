[custom]
;规则从上往下匹配，优先命中上位规则

;本地地址直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

;美区锁定：必须让对方看到固定美国 IP 的服务（功能按地区开放 / 账户风控严格）
;Apple Intelligence / Siri / iCloud 私密中继（含 STUN 3478/5349/19302 端口）
ruleset=📍 美区锁定,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Apple-AI.list
;美国号码：T-Mobile / Sprint、WiFi 通话、Google Voice
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,3gppnetwork.org
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,t-mobile.com
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,tmobile.com
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,t-mobilemoney.com
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,t-mo.co
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,sprint.com
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,voice.google.com
;支付（PayPal 列表已含 Venmo、Xoom、Braintree）
ruleset=📍 美区锁定,[]GEOSITE,paypal
;游戏
ruleset=📍 美区锁定,[]DOMAIN-SUFFIX,theriansaga.com

;AI服务（Cloudflare 人机验证跟 AI 走同一出口，避免验证循环）
ruleset=🤖 AI服务,[]GEOSITE,bing
ruleset=🤖 AI服务,[]GEOSITE,anthropic
ruleset=🤖 AI服务,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🤖 AI服务,[]DOMAIN,challenges.cloudflare.com

;谷歌：先拦下国内可直连的部分和 FCM，再走大类
ruleset=🎯 全球直连,[]GEOSITE,google@cn
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🎥 流媒体,[]GEOSITE,youtube
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🇬 谷歌服务,[]GEOIP,google,no-resolve

;流媒体/TikTok
ruleset=🎥 流媒体,[]GEOSITE,netflix
ruleset=🎥 流媒体,[]GEOSITE,disney
ruleset=🎥 流媒体,[]GEOSITE,hbo
ruleset=🎥 流媒体,[]GEOSITE,primevideo
ruleset=🎶 TikTok,[]GEOSITE,tiktok

;自定义直连 / 代理（保持原位置：列表里的 akamaized.net 等条目若放到最前，会抢走美区锁定和流媒体的流量）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Custom_Direct_Classical.list
ruleset=🚀 手动选择,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Custom_Proxy_Classical.list

;国内服务直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Steam_CDN.list
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

;常规分流
ruleset=🔴 Oracle服务,[]GEOSITE,oracle
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🚀 GitHub,[]GEOSITE,github
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=💬 即时通讯,[]GEOIP,telegram,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,twitter,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,facebook,no-resolve
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest

;GFW / 国内 / 兜底
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
ruleset=🔀 非标端口,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Custom_Port_Direct.list
ruleset=🐟 漏网之鱼,[]FINAL

;设置分组标志位
custom_proxy_group=🚀 手动选择`select`[]🇯🇵 Oracle回落`[]🇺🇸 美国节点`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT

;回落组：同一台机器的两条线路，出口 IP 不变
;末尾的 REJECT：节点名没匹配上或两条线路都挂了时直接断开，不会悄悄变成直连
;Oracle 东京：XHTTP 优先，不通切 Vision
custom_proxy_group=🇯🇵 Oracle回落`fallback`(Oracle_arm-xhttp)`(Oracle_arm-vision)`[]REJECT`https://www.gstatic.com/generate_204`180
;洛杉矶 B（ns）：Hysteria2 优先，不通切 CDN
custom_proxy_group=🇺🇸 ns回落`fallback`(ns-hysteria2|LA-hysteria2)`(ns-cdn-ws|LA-cdn-ws)`[]REJECT`https://www.gstatic.com/generate_204`180
;洛杉矶 A（vm）：Hysteria2 优先，不通切 CDN
custom_proxy_group=🇺🇸 vm回落`fallback`(vm-hysteria2)`(vm-cdn-ws)`[]REJECT`https://www.gstatic.com/generate_204`180

custom_proxy_group=🇺🇸 美国节点`select`[]🇺🇸 vm回落`[]🇺🇸 ns回落`.*us.*
custom_proxy_group=🇯🇵 日本节点`select`[]🇯🇵 Oracle回落`.*jp.*

;AI 和美区锁定：只用固定出口的回落组，哪台检测结果好就放第一位
custom_proxy_group=🤖 AI服务`select`[]🇺🇸 vm回落`[]🇺🇸 ns回落
custom_proxy_group=📍 美区锁定`select`[]🇺🇸 vm回落`[]🇺🇸 ns回落

custom_proxy_group=🔴 Oracle服务`select`[]DIRECT`[]🇯🇵 日本节点`[]🇺🇸 美国节点
custom_proxy_group=🎥 流媒体`select`[]🇺🇸 ns回落`[]🇺🇸 美国节点`[]🇯🇵 日本节点
custom_proxy_group=🎶 TikTok`select`[]🇺🇸 ns回落`[]🇺🇸 美国节点`[]🇯🇵 日本节点
custom_proxy_group=💬 即时通讯`select`[]🚀 手动选择
custom_proxy_group=🌐 社交媒体`select`[]🚀 手动选择
custom_proxy_group=🚀 GitHub`select`[]🚀 手动选择
custom_proxy_group=📢 谷歌FCM`select`[]🚀 手动选择
custom_proxy_group=🇬 谷歌服务`select`[]🇺🇸 vm回落`[]🚀 手动选择
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🎮 游戏平台`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🎮 Steam`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🚀 测速工具`select`[]🎯 全球直连`[]🚀 手动选择

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]🎯 全球直连
;设置分组标志位结束

enable_rule_generator=true
overwrite_original_rules=true
