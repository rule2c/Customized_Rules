name: Update geosite lists

on:
  schedule:
    - cron: "30 22 * * *"   # 每天北京时间 06:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert geosite to classical lists
        run: |
          python3 scripts/geosite_to_classical.py 'category-ai-!cn' rule/AI_NonCN.list \
            --title 'AI 服务（非中国大陆），对应 mihomo 的 GEOSITE,category-ai-!cn，供 Shadowrocket 使用' \
            --min-rules 100

      - name: Commit if changed
        run: |
          if git diff --quiet -- rule/ && [ -z "$(git ls-files --others --exclude-standard rule/)" ]; then
            echo "规则无变化，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rule/
          git commit -m "Update AI_NonCN.list from geosite category-ai-!cn"
          git push
