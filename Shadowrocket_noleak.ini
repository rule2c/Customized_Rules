[custom]
;=======================================================================
; Shadowrocket 高完整度混合版（由 noleak.ini 转写）
;
; 规则源分工：
;   MetaCubeX/meta-rules-dat  geosite/classical/  → GEOSITE 分类的 1:1 文本导出
;                                                   （DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD）
;   blackmatrix7/ios_rule_script Shadowrocket/    → 补 IP 段，其 IP-CIDR 自带 no-resolve
;
; 为什么混用：meta 的 geoip/classical 不带 no-resolve，会让域名请求触发本地 DNS 查询，
;             与本配置的防泄漏目标冲突；blackmatrix7 的 list 自带 no-resolve，用它补 IP。
;
; 用法：subconverter 转换时 target=surge&ver=4，config 指向本文件
;=======================================================================

;美国账户服务相关
ruleset=🗽 美国账户,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Apple-AI.list
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,theriansaga.com
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,t-mobile.com
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,tmobile.com
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,t-mobilemoney.com
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,t-mo.co
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,sprint.com
ruleset=🗽 美国账户,[]DOMAIN-SUFFIX,3gppnetwork.org
ruleset=🗽 美国账户,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/paypal.list

;AI服务
ruleset=🤖 AI服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/bing.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/anthropic.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/openai.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-ai-!cn.list

;谷歌/流媒体/TikTok
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/google.list
;（替代 []GEOIP,google,no-resolve —— blackmatrix7 的 IP-CIDR 自带 no-resolve）
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list
ruleset=🎶 TikTok,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/tiktok.list

;本地地址和域名直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/private.list
;（替代 []GEOIP,private,no-resolve）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Custom_Direct_Classical.list

;自定义代理
ruleset=🚀 手动选择,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Custom_Proxy_Classical.list

;国内服务直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/google@cn.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-games@cn.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Steam_CDN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-game-platforms-download.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-public-tracker.list

;常规分流
ruleset=🔴 Oracle服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/oracle.list
ruleset=💬 即时通讯,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-communication.list
ruleset=🌐 社交媒体,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-social-media-!cn.list
ruleset=🚀 GitHub,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/github.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/apple.list
ruleset=🎮 Steam,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-games.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/googlefcm.list

;（替代 []GEOIP,telegram / twitter / facebook，均自带 no-resolve）
ruleset=💬 即时通讯,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list
ruleset=🌐 社交媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Twitter/Twitter.list
ruleset=🌐 社交媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Facebook/Facebook.list

ruleset=🚀 测速工具,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/category-speedtest.list

;GFW / 国内 / 兜底
ruleset=🚀 手动选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/gfw.list
;（geosite:cn 的 classical 文本体积在 MB 级，iOS NE 内存吃紧；
;  这里改用 blackmatrix7 精简版 ChinaMax + 原生 GEOIP,CN。
;  若要极致还原可换成 .../meta/geo/geosite/classical/cn.list，但请先实测内存）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax.list
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🔀 非标端口,https://raw.githubusercontent.com/rule2c/Customized_Rules/refs/heads/main/rule/Custom_Port_Direct.list
ruleset=🐟 漏网之鱼,[]FINAL

;设置分组标志位（与 noleak.ini 完全一致）
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT

custom_proxy_group=🇺🇸 美国节点`select`.*us.*
custom_proxy_group=🇯🇵 日本节点`select`.*jp.*
custom_proxy_group=🇭🇰 香港节点`select`.*hk.*

custom_proxy_group=🗽 美国账户`select`[]🇺🇸 美国节点

custom_proxy_group=🔴 Oracle服务`select`[]DIRECT`[]🇯🇵 日本节点
custom_proxy_group=🤖 AI服务`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点
custom_proxy_group=🎥 流媒体`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点
custom_proxy_group=🎶 TikTok`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点
custom_proxy_group=💬 即时通讯`select`[]🚀 手动选择
custom_proxy_group=🌐 社交媒体`select`[]🚀 手动选择
custom_proxy_group=🚀 GitHub`select`[]🚀 手动选择
custom_proxy_group=📢 谷歌FCM`select`[]🚀 手动选择
custom_proxy_group=🇬 谷歌服务`select`[]🚀 手动选择
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🎮 游戏平台`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🎮 Steam`select`[]🎯 全球直连`[]🚀 手动选择
custom_proxy_group=🚀 测速工具`select`[]🎯 全球直连`[]🚀 手动选择

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]🎯 全球直连
;设置分组标志位结束

enable_rule_generator=true
overwrite_original_rules=true
